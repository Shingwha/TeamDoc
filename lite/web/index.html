<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-color="blue">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TeamDoc</title>
  <!-- favicon 静态兜底用默认蓝色种子(#3370ff);theme.js 加载后会按当前种子色重绘。
       这里的值只影响"首帧到 theme.js 执行"之间的极短瞬间,故与默认色一致即可,
       不要写死一个与 6 个种子色都不沾边的颜色(此前是 #6c5ce7,紫色且不在色板内)。 -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233370ff'/%3E%3Cpath d='M9 9h14v3H9zm0 5.5h14v3H9zm0 5.5h9v3H9z' fill='white'/%3E%3C/svg%3E">
  <script>
    // 首屏防闪烁:在样式加载前恢复主题与种子色(与 js/theme.js 的存储键保持一致)
    (function () {
      var m = localStorage.getItem('td:theme-mode') || 'system';
      var c = localStorage.getItem('td:seed-color') || 'blue';
      var dark = m === 'dark' || (m === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      document.documentElement.dataset.color = c;
    })();
  </script>
  <!-- Remix Icon 4.5.0(class 方式);本地 vendor,断外网可用 -->
  <link rel="stylesheet" href="/vendor/remixicon/remixicon.css">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/editor.css">
</head>
<body>
  <!-- 登录后的 SPA 壳:纯左右布局(侧栏三段式 + 主区);窄屏侧栏常驻 72px 图标栏,点搜索/导航项抽屉式浮出完整侧栏 -->
  <div id="shell" hidden>
    <aside id="sidebar">
      <!-- 顶部:文字标 + 常驻折叠按钮(宽屏可收起为图标栏) -->
      <div class="side-brand-row">
        <a class="side-brand" href="#/">TeamDoc</a>
        <button class="btn-icon" id="side-collapse" type="button" title="收起侧栏"><i class="ri-side-bar-line"></i></button>
      </div>
      <!-- 全局搜索:展开态为输入框;折叠态由下方按钮顶替(见 app.css .side-search-btn) -->
      <div class="side-search">
        <i class="ri-search-line"></i>
        <input id="global-search" type="text" placeholder="搜索(Ctrl+K)" autocomplete="off">
      </div>
      <button class="side-search-btn" id="side-search-btn" type="button" title="搜索(Ctrl+K)"><i class="ri-search-line"></i></button>
      <!-- 中间:项目(导航到项目列表)+ 项目树(可展开)+ 管理后台 + 个人设置,独立滚动 -->
      <div class="side-body">
        <a class="side-item" data-route="projects" href="#/" title="项目">
          <i class="ri-folders-line"></i><span class="side-label">项目</span>
        </a>
        <div id="side-projects"></div>
        <div class="side-sep"></div>
        <a class="side-item" data-route="discover" href="#/discover" title="发现">
          <i class="ri-compass-3-line"></i><span class="side-label">发现</span>
        </a>
        <a class="side-item" data-route="admin" id="side-admin" href="#/admin" title="管理后台" hidden>
          <i class="ri-shield-user-line"></i><span class="side-label">管理后台</span>
        </a>
        <a class="side-item" data-route="settings" href="#/settings" title="个人设置">
          <i class="ri-settings-3-line"></i><span class="side-label">个人设置</span>
        </a>
      </div>
      <!-- 底部:用户卡片(点击向上弹出菜单) -->
      <button class="side-user" id="side-user" type="button"></button>
    </aside>
    <!-- 窄屏抽屉遮罩(仅 #shell.nav-open 时显示) -->
    <div class="side-scrim" id="side-scrim"></div>
    <main id="main"><div id="view"></div></main>
  </div>

  <!-- 登录 / 初始化向导视图(无壳),由 app.js 渲染 -->
  <div id="login-root" hidden></div>
  <div id="toast-root"></div>

  <!-- Markdown 渲染栈:全部本地 vendor(纯内网可运行);KaTeX 按需懒加载,见 js/markdown.js -->
  <script src="/vendor/marked/marked.min.js"></script>
  <script src="/vendor/prism/prism.min.js"></script>
  <script src="/vendor/prism/prism-autoloader.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/markdown.js"></script>
  <script src="/js/preview.js"></script>
  <script src="/js/doceditor.js"></script>
  <script src="/js/views/projects.js"></script>
  <script src="/js/views/project.js"></script>
  <script src="/js/views/drive.js"></script>
  <script src="/js/views/search.js"></script>
  <script src="/js/views/admin.js"></script>
  <script src="/js/views/discover.js"></script>
  <script src="/js/views/settings.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
